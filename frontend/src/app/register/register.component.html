<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center" (click)="onCancel()">
  <dialog open class="m-auto bg-white rounded-lg shadow-lg p-6 w-full max-w-md" (click)="$event.stopPropagation()">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Register</h2>
    <form (ngSubmit)="onSubmit()" class="space-y-4" [formGroup]="profileForm">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
        <input type="text" id="name" name="name"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
          [(ngModel)]="newUserDTO.name" formControlName="name">
        @if(nameIsInvalid) {
        <p class="control-error">Please enter a name with 4-10 characters, no numbers or special characters.</p>
        }
      </div>

      <div>
        <label for="surname" class="block text-sm font-medium text-gray-700">Surname</label>
        <input type="text" id="surname" name="surname"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
          [(ngModel)]="newUserDTO.surname" formControlName="surname">
        @if(nameIsInvalid) {
        <p class="control-error">Please enter a name with 4-10 characters, no numbers or special characters.</p>
        }
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="text" id="email" name="email"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
          [(ngModel)]="newUserDTO.email" formControlName="email">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
          [(ngModel)]="newUserDTO.password" formControlName="password">
        @if(passwordIsInvalid) {
        <p class="control-error"> Must be valid password with min 6 caracters.</p>
        }
      </div>

      <div>
        <label for="text" class="block text-sm font-medium text-gray-700">Birthday</label>
        <input type="text" id="text" name="text"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
          [(ngModel)]="newUserDTO.birthday" formControlName="birthday">
      </div>
      <div class="flex justify-end space-x-4">
        <button class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 cursor-pointer"
          (click)="onProfessionnal()">Professionnal</button>
        <button type="button" (click)="onCancel()"
          class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 cursor-pointer">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 cursor-pointer"
          (click)="onSubmit()">Create</button>
      </div>
    </form>
  </dialog>
</div>
