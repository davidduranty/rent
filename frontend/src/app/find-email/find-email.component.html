<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
  <dialog open class="m-auto bg-white rounded-lg shadow-lg p-6 w-full max-w-md" (click)="$event.stopPropagation()">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Account Recovery</h2>
    <form (ngSubmit)="onSubmit()" class="space-y-4" [formGroup]="profileForm">

      <div>
        <label for="email" class="block text-xl font-medium text-gray-700">Email</label>
        <input type="text" id="email" name="email"
          class="mt-1 pl-2 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 placeholder:text-gray-300 placeholder:text-sm"
          formControlName="email" placeholder="Enter your email address">
        @if(emailIsInvalid) {
        <p class="control-error"> Please enter a valid email adress.</p>
        }
      </div>

      <div class="flex justify-end space-x-4">

        <button type="button" (click)="retry()"
          class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 cursor-pointer">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 cursor-pointer"
          (click)="onSubmit()">Enter</button>
      </div>


    </form>
  </dialog>
</div>
