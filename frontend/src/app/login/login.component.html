<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
  <dialog open class="m-auto bg-white rounded-lg shadow-lg p-6 w-full max-w-md" (click)="$event.stopPropagation()">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">LOGIN</h2>
    <form (ngSubmit)="onSubmit()" class="space-y-4" [formGroup]="profileForm">

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="text" id="email" name="email" class="mt-1 pl-2 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500
          placeholder:text-gray-300 placeholder:text-sm" formControlName="email"
          placeholder="Enter your email address">
        @if(emailIsInvalid) {
        <p class="control-error"> Please enter a valid email adress.</p>
        }
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password" class="mt-1 pl-2 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500
          placeholder:text-gray-300 placeholder:text-sm" placeholder="Enter your password" formControlName="password">
        @if(passwordIsInvalid) {
        <p class="control-error"> Must be valid password with min 8 caracters.</p>
        }
      </div>

      <div class="flex justify-end space-x-4">
        <button class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 cursor-pointer"
          (click)="register()">New
          inscription
          ?</button>
        <button type="button" (click)="onCancel()"
          class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 cursor-pointer">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 cursor-pointer"
          (click)="onSubmit()">Enter</button>
      </div>
      <div class="flex justify-end mt-4">
        <p class="text-xs text-gray-500 cursor-pointer underline" (click)="loginLost()">Mot de passe ou email oubliés !
        </p>
      </div>

    </form>
  </dialog>
</div>
