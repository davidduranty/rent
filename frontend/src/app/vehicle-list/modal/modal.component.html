<div class="fixed inset-0 flex items-center justify-center">
  <div class="absolute inset-0 bg-black opacity-80"></div>
  <dialog open class="relative z-10 m-auto bg-white rounded-lg shadow-lg p-6 w-full max-w-md"
    (click)="$event.stopPropagation()">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Information</h2>
    <div class="mb-4 border-b pb-4">
      <img [src]="vehicles.image" [alt]="vehicles.brand" class="w-full h-40 object-cover rounded mb-2">
      <p class="text-gray-600 mb-2">{{ vehicles.description }}</p>
      <p class="font-semibold text-lg text-gray-700 mb-1">{{ vehicles.price }} € / jour</p>
      <div class="flex justify-end">
        <button type="button" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 cursor-pointer"
          (click)="cancel()">
          Cancel
        </button>
      </div>
    </div>
  </dialog>
</div>
