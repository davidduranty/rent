<header class="text-center">
  <h1 class="text-2xl font-bold mb-4 mt-4">Liste des véhicles disponibles</h1>
</header>
<main>
  <div class="flex flex-wrap justify-center items-center row-auto gap-4">
    @for (list of vehicles; track list.id) {
    @if (list.available === true) {
    <div
      class="flex-col rounded-lg border-2 min-w-120 max-w-121 cursor-pointer min-h-64 bg-gradient-to-br from-black via-white to-black">
      <div class="flex">
        <h2 class="flex items-start text-white">{{list.brand}}</h2>
        <p class="ml-2 text-white">{{list.model}}</p>
      </div>
      <div class="flex">
        <p class="text-white"> {{list.type}}</p>
        <p class="text-white ml-3">Boîte: {{list.transmition}}</p>

      </div>
      <div class="flex justify-self-start items-center border-1 rounded-full w-18 bg-gray-900 mt-2">
        <span class="material-icons mr-2 ml-1 text-white">person</span>
        <p class="text-white ">{{list.place}}</p>
      </div>
      <img class="" src="{{list.image}}" alt="">
      <div class="flex justify-center">
        <a class="bg-gray-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded mr-0.5 min-w-20 block cursor-pointer"
          routerLink="new-reservation">Reserver</a>

      </div>
    </div>
    }
    }

  </div>
</main>
