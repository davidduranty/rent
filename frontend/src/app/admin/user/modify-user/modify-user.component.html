<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center" (click)="onCancel()">
  <dialog open class="m-auto bg-white rounded-lg shadow-lg p-6 w-full max-w-md" (click)="$event.stopPropagation()">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Modify Location</h2>
    <form (ngSubmit)="onSubmit()" [formGroup]="updateForm" class="space-y-4">

      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
        <input type="text" id="name" name="name" value="name" formControlName="name"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>

      <div>
        <label for="surname" class="block text-sm font-medium text-gray-700">Surname</label>
        <input type="text" id="surname" name="surname" value="surname" formControlName="surname"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="text" id="email" name="email" value="email" formControlName="email"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password" value="password" formControlName="password"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>

      <div>
        <label for="birthday" class="block text-sm font-medium text-gray-700">Birthday</label>
        <input type="text" id="birthday" name="birthday" value="birthday" formControlName="birthday"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div class="flex items-center">
        <input type="checkbox" id="isAdmin" name="isAdmin"
          class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500" formControlName="isAdmin">
        <label for="isAdmin" class="ml-2 block text-sm text-gray-700">IsAdmin</label>
      </div>

      <div class="flex items-center">
        <input type="checkbox" id="professionnal" name="professionnal"
          class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500" formControlName="professionnal">
        <label for="professionnal" class="ml-2 block text-sm text-gray-700">Professionnal</label>
      </div>

      <div class="flex justify-end space-x-4">
        <button type="button" (click)="onCancel()"
          class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 cursor-pointer">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 cursor-pointer"
          (click)="onSubmit()">Modify</button>
      </div>
    </form>
  </dialog>
</div>
