<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center" (click)="onCancel()">
  <dialog open class="m-auto bg-white rounded-lg shadow-lg p-6 w-full max-w-md" (click)="$event.stopPropagation()">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Add User</h2>
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
        <input type="text" id="name" name="name"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>

      <div>
        <label for="surname" class="block text-sm font-medium text-gray-700">Surname</label>
        <input type="text" id="surname" name="surname"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="text" id="email" name="email"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>

      <div>
        <label for="text" class="block text-sm font-medium text-gray-700">Birthday</label>
        <input type="text" id="text" name="text"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>

      <div class="flex items-center">
        <input type="checkbox" id="isAdmin" name="isAdmin"
          class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
        <label for="isAdmin" class="ml-2 block text-sm text-gray-700">Admin</label>
      </div>

      <div class="flex items-center">
        <input type="checkbox" id="professionnal" name="professionnal"
          class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
        <label for="professionnal" class="ml-2 block text-sm text-gray-700">Professional</label>
      </div>

      <div class="flex justify-end space-x-4">
        <button type="button" (click)="onCancel()"
          class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">Create</button>
      </div>
    </form>
  </dialog>
</div>
