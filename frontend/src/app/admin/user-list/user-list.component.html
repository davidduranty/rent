<h1 class="text-2xl text-center">LIST USERS</h1>
<div class="flex justify-center items-center h-screen bg-gray-100">
  <table class="table-auto border-collapse border border-gray-300 shadow-lg bg-white rounded-lg">
    <thead class="bg-gray-200">
      <tr>
        <th class="px-6 py-3 border border-gray-300 text-left font-semibold text-gray-700">Id</th>
        <th class="px-6 py-3 border border-gray-300 text-left font-semibold text-gray-700">Name</th>
        <th class="px-6 py-3 border border-gray-300 text-left font-semibold text-gray-700">Surname</th>
        <th class="px-6 py-3 border border-gray-300 text-left font-semibold text-gray-700">Email</th>
        <th class="px-6 py-3 border border-gray-300 text-left font-semibold text-gray-700">Birthday</th>
        <th class="px-6 py-3 border border-gray-300 text-left font-semibold text-gray-700">Password</th>
      </tr>
    </thead>
    <tbody>
      @for (user of listUser; track user.id) {
      <tr class="hover:bg-gray-200">
        <td class="px-6 py-4 border border-gray-300 text-gray-600">{{user.id}}</td>
        <td class="px-6 py-4 border border-gray-300 text-gray-600">{{user.name}}</td>
        <td class="px-6 py-4 border border-gray-300 text-gray-600">{{user.surname}}</td>
        <td class="px-6 py-4 border border-gray-300 text-gray-600">{{user.email}}</td>
        <td class="px-6 py-4 border border-gray-300 text-gray-600">{{user.birthday}}</td>
        <td class="px-6 py-4 border border-gray-300 text-gray-600">{{user.password}}</td>
      </tr>
      }
    </tbody>
  </table>
</div>
