<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center" (click)="onCancel()">
  <dialog open class="m-auto bg-white rounded-lg shadow-lg p-6 w-full max-w-md" (click)="$event.stopPropagation()">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Modify Vehicle</h2>
    <form (ngSubmit)="onSubmit()" [formGroup]="updateForm" class="space-y-4">

      <div>
        <label for="brand" class="block text-sm font-medium text-gray-700">Brand</label>
        <input type="text" id="brand" name="brand" value="brand" formControlName="brand"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>

      <div>
        <label for="model" class="block text-sm font-medium text-gray-700">Model</label>
        <input type="text" id="model" name="model" value="model" formControlName="model"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>

      <div>
        <label for="image" class="block text-sm font-medium text-gray-700">Image</label>
        <input type="text" id="image" name="image" value="image" formControlName="image"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div>
        <label for="transmition" class="block text-sm font-medium text-gray-700">Transmition</label>
        <input type="text" id="transmition" name="transmition" value="transmition" formControlName="transmition"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>

      <div>
        <label for="place" class="block text-sm font-medium text-gray-700">Place</label>
        <input type="number" id="place" name="place" value="place" formControlName="place"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div>
        <label for="type" class="block text-sm font-medium text-gray-700">Type</label>
        <input type="text" id="type" name="type" value="type" formControlName="type"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>

      <div class="flex items-center">
        <input type="checkbox" id="available" name="available"
          class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500" formControlName="available">
        <label for="available" class="ml-2 block text-sm text-gray-700">Available</label>
      </div>

      <div class="flex justify-end space-x-4">
        <button type="button" (click)="onCancel()"
          class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 cursor-pointer">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 cursor-pointer"
          (click)="onSubmit()">Modify</button>
      </div>
    </form>
  </dialog>
</div>
